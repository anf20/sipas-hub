server {
  listen 80;
  listen 443 ssl;
  
  ssl_certificate /etc/nginx/ssl-certificates/www.sipashub.my.id.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/www.sipashub.my.id.key;
  
  server_name sipashub.my.id;
  return 301 https://www.sipashub.my.id$request_uri;
}

server {
  listen 80;
  listen 443 ssl;
  
  ssl_certificate /etc/nginx/ssl-certificates/www.sipashub.my.id.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/www.sipashub.my.id.key;
  
  server_name www.sipashub.my.id www1.sipashub.my.id;
  root /home/sipashub-user/htdocs/public;

  access_log /var/log/nginx/sipashub-access.log;
  error_log /var/log/nginx/sipashub-error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_hide_header X-Varnish;
    proxy_redirect off;

    proxy_send_timeout 720;
    proxy_read_timeout 720;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;

    if (-f $request_filename) {
      break;
    }
  }
}

server {
  listen 8080;
  server_name www.sipashub.my.id www1.sipashub.my.id;
  root /home/sipashub-user/htdocs/public;

  index index.php index.html;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    
    if (!-f $document_root$fastcgi_script_name) {
      return 404;
    }
    
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:19001;
    fastcgi_param PHP_VALUE "";
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;

    if (-f $request_filename) {
      break;
    }
  }
}
